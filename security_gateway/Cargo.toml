[package]
name = "security_gateway"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "wnc-gw"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["rt", "macros", "process", "time"] }
rtnetlink = "0.23.0"
futures = "0.3.34"
genetlink = "0.3.0"
netlink-packet-generic = "0.5.0"
netlink-packet-core = "0.9.0"
