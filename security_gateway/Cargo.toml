[package]
name = "security_gateway"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "wnc-gw"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["rt", "macros", "process", "time", "io-util", "signal", "sync", "net"] }
rtnetlink = "0.23.0"
futures = "0.3.34"
genetlink = "0.3.0"
netlink-packet-generic = "0.5.0"
netlink-packet-core = "0.9.0"
nftables = "0.6.3"
serde_json = "1.0.154"
libc = "0.2.191"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "ansi"] }
