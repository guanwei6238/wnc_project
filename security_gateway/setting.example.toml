# wnc-gw configuration example
#
# Copy this file to /etc/wnc-gw/setting.toml (the default path), or pass
# another file with `wnc-gw -c <FILE>`.
#
# Every value below is commented out on purpose: the gateway never guesses
# which interface plays which role. Uncomment and edit the ones you need.

# Forwarding mode (default: "bridge"):
#   - "bridge": LAN and WAN are ports of one Linux bridge and the gateway filters
#     the bridged traffic (transparent; both sides are in the same subnet).
#     Create the bridge with your network manager; wnc-gw only checks it.
#   - "routed": the gateway routes between two subnets.
# Run `wnc-gw doctor` to see the mode in effect and what it requires.
# mode = "bridge"

# Where the gateway's core eBPF program attaches on each port (default: "auto"):
#   - "auto":    native XDP on ports whose driver supports it, TC otherwise.
#                Generic XDP is never chosen automatically: it is slower than TC.
#   - "off":     always TC.
#   - "generic": generic XDP even without driver support (for testing; it
#                disables GRO on the interface).
# Run `wnc-gw doctor` to see which hook each port would use.
# xdp = "auto"

[ports]
# Each port is selected by interface name or by MAC address:
#   - name: as shown by `ip link` or `wnc-gw show interfaces`, e.g. "eth0"
#   - MAC:  aa:bb:cc:dd:ee:ff or aa-bb-cc-dd-ee-ff (case-insensitive)
#
# A MAC is matched against the permanent (factory) MAC first; the current MAC
# is used only when no interface has that permanent MAC. If more than one
# interface matches, select the port by name instead.
#
# `--lan` and `--wan` on the command line override these values.
# Run `wnc-gw doctor` to see which interface each port resolves to.

# Internal side (the network being protected).
# lan = "eth0"

# External side (towards the Internet).
# wan = "9c:69:d3:2a:11:54"

[nftables]
# Absolute path of the nft command (default: "/usr/sbin/nft").
# path = "/usr/sbin/nft"

[suricata]
# Absolute path of the suricata command (default: "/usr/bin/suricata").
# Point it at another installation to use a specific Suricata version.
# path = "/usr/bin/suricata"

# Suricata's own config file (default: "/etc/suricata/suricata.yaml").
# config = "/etc/suricata/suricata.yaml"

# NFQUEUE number Suricata receives packets from (default: 0), or a range such
# as "0-3" to spread the traffic over several queues. Suricata fails to start
# if another program already uses one of them.
# queue = 0

# Seconds to wait for Suricata to report that it is ready (default: 300).
# Loading a large rule set can take minutes on slow hardware. If Suricata is
# not ready in time, it is stopped and started again.
# ready_timeout = 300

# The gateway runs these programs with its own privileges. `wnc-gw doctor`
# warns when a non-root account can modify them or the directories they are in.
