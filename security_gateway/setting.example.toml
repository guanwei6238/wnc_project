# wnc-gw configuration example
#
# Copy this file to /etc/wnc-gw/setting.toml (the default path), or pass
# another file with `wnc-gw -c <FILE>`.
#
# Every value below is commented out on purpose: the gateway never guesses
# which interface plays which role. Uncomment and edit the ones you need.

# Forwarding mode (default: "bridge"):
#   - "bridge": LAN and WAN are ports of one Linux bridge and the gateway filters
#     the bridged traffic (transparent; both sides are in the same subnet).
#     Create the bridge with your network manager; wnc-gw only checks it.
#   - "routed": the gateway routes between two subnets.
# Run `wnc-gw doctor` to see the mode in effect and what it requires.
# mode = "bridge"

# Where the gateway's core eBPF program attaches on each port (default: "auto"):
#   - "auto":    native XDP on ports whose driver supports it, TC otherwise.
#                Generic XDP is never chosen automatically: it is slower than TC.
#   - "off":     always TC.
#   - "generic": generic XDP even without driver support (for testing; it
#                disables GRO on the interface).
# Run `wnc-gw doctor` to see which hook each port would use.
# xdp = "auto"

# What the gateway does with Suricata's verdicts (default: "ids"):
#   - "ids": detect only. The kernel forwards every packet at once and hands a
#     copy to Suricata over NFLOG (see `group` below), so Suricata never slows
#     down or blocks traffic. Suricata's checksum validation is turned off,
#     because packets merged by GRO reach it with incomplete checksums.
#   - "ips": every packet waits in an NFQUEUE (see `queue` below) for
#     Suricata's verdict, so rules with action "drop" block traffic.
# `wnc-gw doctor` explains what the chosen mode does not protect against.
# protection = "ids"

[ports]
# Each port is selected by interface name or by MAC address:
#   - name: as shown by `ip link` or `wnc-gw show interfaces`, e.g. "eth0"
#   - MAC:  aa:bb:cc:dd:ee:ff or aa-bb-cc-dd-ee-ff (case-insensitive)
#
# A MAC is matched against the permanent (factory) MAC first; the current MAC
# is used only when no interface has that permanent MAC. If more than one
# interface matches, select the port by name instead.
#
# `--lan` and `--wan` on the command line override these values.
# Run `wnc-gw doctor` to see which interface each port resolves to.

# Internal side (the network being protected).
# lan = "eth0"

# External side (towards the Internet).
# wan = "9c:69:d3:2a:11:54"

[nftables]
# Absolute path of the nft command (default: "/usr/sbin/nft").
# path = "/usr/sbin/nft"

[suricata]
# Absolute path of the suricata command (default: "/usr/bin/suricata").
# Point it at another installation to use a specific Suricata version.
# path = "/usr/bin/suricata"

# Suricata's own config file (default: "/etc/suricata/suricata.yaml").
# config = "/etc/suricata/suricata.yaml"

# NFQUEUE number Suricata receives packets from when protection = "ips"
# (default: 0), or a range such as "0-3" to spread the traffic over several
# queues. Each queue is inspected by its own Suricata thread, so a range of N
# queues can use up to N CPU cores. Suricata fails to start if another program
# already uses one of them. Only allowed with protection = "ips": with "ids" it
# would do nothing, so the config is rejected.
# queue = 0

# NFLOG group Suricata receives copies from when protection = "ids" (default:
# 10), or a range such as "10-11" to spread the traffic over several groups.
# Each group is inspected by its own Suricata thread, as with queues. Group 0 is
# not allowed. Suricata fails to start if another program already uses one of
# them. Only allowed with protection = "ids": with "ips" it would do nothing,
# so the config is rejected.
# group = 10

# Seconds to wait for Suricata to report that it is ready (default: 300).
# Loading a large rule set can take minutes on slow hardware. If Suricata is
# not ready in time, it is stopped and started again.
# ready_timeout = 300

# Seconds to wait for Suricata to exit after asking it to stop (default: 90).
# Before exiting, Suricata writes a record of every open flow to its log, which
# can take tens of seconds when there are many flows. If it is still running
# after this, it is killed and those records are lost.
# stop_timeout = 90

# What happens to forwarded traffic while Suricata cannot inspect it: while it
# starts or restarts, and when it falls behind (default: "accept").
#   "accept"  pass it without inspection (`wnc-gw doctor` warns about this)
#   "drop"    drop it, so the network stops while Suricata is unavailable
# With protection = "ids", traffic that arrives faster than Suricata can take
# the copies is still forwarded either way; Suricata just misses those copies.
# Either way, the log records when inspection stops and starts again.
# when_unavailable = "accept"

# Seconds between reads of Suricata's EVE file (default: 0.5, 0.05 to 10).
# wnc-gw reads the eve-log output that has filetype: regular and alert in its
# types, and only the lines Suricata added since the last read. Shorter means
# alerts reach wnc-gw sooner; longer means fewer wakeups.
# eve_interval = 0.5

# The gateway runs these programs with its own privileges. `wnc-gw doctor`
# warns when a non-root account can modify them or the directories they are in.

[trust]
# How trusted packets skip inspection (default: "tc"). Both apply to automatic
# trust and to `wnc-gw trust add`; only one is used at a time.
#   - "tc":     the core eBPF program forwards them from TC ingress, before the
#               bridge, netfilter and conntrack (the fastest). Needs TCX (Linux
#               6.6 or later); without it nothing is trusted, and run and
#               `wnc-gw doctor` say so.
#   - "ctmark": a conntrack mark that the gateway's nftables forward chain
#               accepts. Works without the core eBPF program, but every trusted
#               packet still goes through the bridge, netfilter and conntrack.
# Either way SYN/FIN/RST are always inspected, and a bare SYN ends the trust.
# Run `wnc-gw doctor` to see the backend in effect.
# backend = "tc"

# Trust connections automatically (default: false). A connection is trusted
# once it has carried min_packets packets in each direction, for at least
# min_age seconds, while Suricata was inspecting and without a Suricata alert.
# Its packets then skip inspection, except SYN/FIN/RST, until the trust expires
# after ttl seconds; an alert on it revokes the trust at once. Trust is the
# most dangerous action of the gateway: an attack sent after a connection is
# trusted is not seen until the trust expires. `wnc-gw doctor` warns about it.
# Needs net.netfilter.nf_conntrack_acct = 1 (packet counters per connection)
# and Suricata's alerts in an EVE file (see eve_interval above).
# Connections can always be trusted by hand with `wnc-gw trust add`.
# auto = false

# The options below are only allowed with auto = true: without it they would
# do nothing, so the config is rejected.

# Packets each direction must carry before a connection can be trusted
# (default: 10, 1 to 1000000).
# min_packets = 10

# Seconds a connection must be watched before it can be trusted (default: 5,
# 1 to 3600). Gives Suricata's alerts time to reach wnc-gw.
# min_age = 5

# Seconds a connection stays trusted before it is inspected again (default:
# 900, 10 to 86400). With protection = "ips", keep it longer than Suricata's
# flow-timeouts.tcp.established (600 by default): Suricata then has forgotten
# the connection and picks it up again instead of dropping its packets as out
# of sync. `wnc-gw doctor` warns when it is not.
# ttl = 900

# Seconds between reads of the conntrack table (default: 5, 1 to 60).
# check_interval = 5
